# Redireciona todo HTTP → HTTPS
server {
    listen 80;
    server_name chat.mobillirentals.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS principal
server {
    listen 443 ssl;
    server_name chat.mobillirentals.com.br;

    ssl_certificate     /etc/letsencrypt/live/chat.mobillirentals.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.mobillirentals.com.br/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Re-resolve DNS do Docker a cada 10s (evita IP antigo em cache após restart de containers)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Permite headers com underscore (ex: api_access_token) — nginx descarta por padrão
    underscores_in_headers on;

    # Tamanho máximo de upload (anexos do WhatsApp, imagens, etc.)
    client_max_body_size 100M;

    # Timeouts para evitar queda em respostas lentas do Rails
    proxy_read_timeout  300s;
    proxy_send_timeout  300s;

    location / {
        set $upstream http://rails:3000;
        proxy_pass         $upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    # WebSocket (notificações em tempo real do Chatwoot)
    location /cable {
        set $upstream http://rails:3000;
        proxy_pass         $upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 86400s;
    }
}
