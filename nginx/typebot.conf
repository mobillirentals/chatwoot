# =============================================================
# Typebot — bot.mobillirentals.com.br (builder)
#           botviewer.mobillirentals.com.br (viewer)
# =============================================================
# Pré-requisito: emitir os certificados antes de subir o nginx
#   certbot certonly --webroot -w /var/www/certbot \
#     -d bot.mobillirentals.com.br \
#     -d botviewer.mobillirentals.com.br
# =============================================================

# ── HTTP → HTTPS (builder) ───────────────────────────────────
server {
    listen 80;
    server_name bot.mobillirentals.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS builder ────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name bot.mobillirentals.com.br;

    ssl_certificate     /etc/letsencrypt/live/bot.mobillirentals.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.mobillirentals.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 50M;
    proxy_read_timeout   120s;
    proxy_send_timeout   120s;

    location / {
        set $upstream http://typebot-builder:3000;
        proxy_pass         $upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }
}

# ── HTTP → HTTPS (viewer) ────────────────────────────────────
server {
    listen 80;
    server_name botviewer.mobillirentals.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS viewer ─────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name botviewer.mobillirentals.com.br;

    ssl_certificate     /etc/letsencrypt/live/bot.mobillirentals.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.mobillirentals.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 50M;
    proxy_read_timeout   120s;
    proxy_send_timeout   120s;

    location / {
        set $upstream http://typebot-viewer:3000;
        proxy_pass         $upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }
}
