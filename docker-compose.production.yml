# =============================================================
# Mobílli Rentals — Chatwoot Production Stack
# Azure VM: chat.mobillirentals.com.br
# =============================================================
# Uso:
#   docker compose -f docker-compose.production.yml up -d
#
# Na primeira execução, inicializar o banco:
#   docker compose -f docker-compose.production.yml run --rm rails bundle exec rails db:chatwoot_prepare
# =============================================================

services:

  # ── Rails (API + Dashboard) ─────────────────────────────────
  rails:
    image: ghcr.io/mobillirentals/chatwoot:latest
    restart: unless-stopped
    env_file: .env.production
    environment:
      - RAILS_ENV=production
      - NODE_ENV=production
    depends_on:
      - chatwoot-db
      - redis
    volumes:
      - chatwoot_storage:/app/storage
    ports:
      - "127.0.0.1:3000:3000"       # exposto só para o Nginx (não público direto)
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]

  # ── Sidekiq (jobs em background) ───────────────────────────
  sidekiq:
    image: ghcr.io/mobillirentals/chatwoot:latest
    restart: unless-stopped
    env_file: .env.production
    environment:
      - RAILS_ENV=production
      - NODE_ENV=production
    depends_on:
      - chatwoot-db
      - redis
    volumes:
      - chatwoot_storage:/app/storage
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]

  # ── PostgreSQL ──────────────────────────────────────────────
  # Nome do serviço = POSTGRES_HOST no .env.production
  chatwoot-db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-chatwoot_production}
    # Porta NÃO exposta ao host — acesso apenas pela rede interna Docker

  # ── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file: .env.production
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data

  # ── Typebot Builder (editor de fluxos) ─────────────────────
  typebot-builder:
    image: baptistearno/typebot-builder:latest
    restart: unless-stopped
    depends_on:
      - chatwoot-db
    ports:
      - "127.0.0.1:3001:3000"
    env_file: .env.production
    environment:
      - DATABASE_URL=${TYPEBOT_DATABASE_URL}
      - NEXTAUTH_URL=${TYPEBOT_NEXTAUTH_URL}
      - NEXT_PUBLIC_VIEWER_URL=${TYPEBOT_VIEWER_URL}
      - NEXTAUTH_SECRET=${TYPEBOT_NEXTAUTH_SECRET}
      - ENCRYPTION_SECRET=${TYPEBOT_ENCRYPTION_SECRET}
      - ADMIN_EMAIL=${TYPEBOT_ADMIN_EMAIL}
      - DISABLE_SIGNUP=${TYPEBOT_DISABLE_SIGNUP}
      - SMTP_HOST=smtp.azurecomm.net
      - SMTP_PORT=587
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_SECURE=false
      - NEXT_PUBLIC_SMTP_FROM=noreply@mobillirentals.com.br
      - STORAGE_PROVIDER=local
    volumes:
      - typebot_uploads:/app/apps/builder/public/uploads

  # ── Typebot Viewer (runtime dos bots) ──────────────────────
  typebot-viewer:
    image: baptistearno/typebot-viewer:latest
    restart: unless-stopped
    depends_on:
      - chatwoot-db
    ports:
      - "127.0.0.1:3002:3000"
    env_file: .env.production
    environment:
      - DATABASE_URL=${TYPEBOT_DATABASE_URL}
      - NEXTAUTH_URL=${TYPEBOT_NEXTAUTH_URL}
      - NEXT_PUBLIC_VIEWER_URL=${TYPEBOT_VIEWER_URL}
      - NEXTAUTH_SECRET=${TYPEBOT_NEXTAUTH_SECRET}
      - ENCRYPTION_SECRET=${TYPEBOT_ENCRYPTION_SECRET}
      - SMTP_HOST=smtp.azurecomm.net
      - SMTP_PORT=587
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_SECURE=false
      - NEXT_PUBLIC_SMTP_FROM=noreply@mobillirentals.com.br
      - STORAGE_PROVIDER=local
    volumes:
      - typebot_uploads:/app/apps/builder/public/uploads

  # ── Nginx (reverse proxy + SSL) ────────────────────────────
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro              # carrega todos os .conf do diretório
      - /etc/letsencrypt:/etc/letsencrypt:ro      # certificados Let's Encrypt
      - nginx_logs:/var/log/nginx
    depends_on:
      - rails
      - typebot-builder
      - typebot-viewer

volumes:
  postgres_data:
  redis_data:
  chatwoot_storage:
  typebot_uploads:
  nginx_logs:
