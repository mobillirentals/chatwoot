# Mesma ideia do whatsapp-number-checker: build autocontido nesta pasta, so a REDE e
# compartilhada com o app principal (`chatwoot-develop_default`), para o container `rails`
# alcancar `http://whatsapp-baileys:3400` pelo nome e para esta ponte alcancar
# `http://rails:3000` ao entregar mensagem recebida.
#
# Porta e pasta de sessao SEPARADAS do verificador de numeros de proposito: sao numeros
# diferentes, e duas conexoes sobre a mesma credencial se derrubam em loop.
#
# Rodar:    docker compose -f whatsapp-baileys/docker-compose.yml up -d --build
# Parear:   abrir http://localhost:3400/qr no navegador e escanear
# Remover:  docker compose -f whatsapp-baileys/docker-compose.yml down
services:
  whatsapp-baileys:
    build: .
    image: whatsapp-baileys:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=3400
    ports:
      - '3400:3400'
    volumes:
      - ./auth_session:/app/auth_session
    networks:
      - default

networks:
  default:
    external: true
    name: chatwoot-develop_default
