# Branding config that the EE edition resets on the community plan.
#
# NOTE (Mobílli): intentionally EMPTY, same reasoning as premium_features.yml.
# The nightly Internal::CheckNewVersionsJob runs Internal::ReconcilePlanConfigService,
# which rewrote every key listed here back to the Chatwoot defaults whenever
# INSTALLATION_PRICING_PLAN is 'community' — which it always is on a self-hosted
# install. That is what kept undoing our branding: INSTALLATION_NAME, BRAND_NAME,
# BRAND_URL and WIDGET_BRAND_URL were silently reverted at 03:39 UTC, hours after
# being set, with no trace in any log (seen on 2026-09-30).
#
# With the list empty the job has nothing to reconcile, so Super Admin → Settings
# is the single source of truth for branding again.
[]
